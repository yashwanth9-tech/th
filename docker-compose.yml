version: '3.9'
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: disaster-postgres
    environment:
      POSTGRES_DB: disaster_demo
      POSTGRES_USER: disaster
      POSTGRES_PASSWORD: disaster123
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
